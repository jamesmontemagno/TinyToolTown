name: Process Author Page Claim

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write

jobs:
  process:
    name: Write author MD file and close issue
    runs-on: ubuntu-latest
    if: github.event.label.name == 'queued-author'

    steps:
      - uses: actions/checkout@v7

      - name: Write author file and close issue
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const {
              parseAuthorClaim,
              validateAuthorClaim,
              renderAuthorMarkdown,
              toolListsAuthor,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/author-claim-parser.cjs`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            if (!labels.includes('claim-verified')) {
              core.setFailed('Author claim must be verified before it can be processed.');
              return;
            }

            const toolsDir = path.join('src', 'content', 'tools');
            const toolFiles = fs.readdirSync(toolsDir).filter(file => file.endsWith('.md'));
            const existingSlugs = new Set(toolFiles.map(file => file.replace(/\.md$/, '')));
            const claim = parseAuthorClaim(body, existingSlugs);
            const hasAcceptedTool = toolFiles.some(file => {
              const content = fs.readFileSync(path.join(toolsDir, file), 'utf8');
              return toolListsAuthor(content, claim.github);
            });
            const errors = validateAuthorClaim(claim, hasAcceptedTool);
            if (errors.length) {
              core.setFailed(`Author claim is not ready: ${errors.join(' ')}`);
              return;
            }

            const mdContent = renderAuthorMarkdown(claim);
            const filePath = path.join('src', 'content', 'authors', `${claim.github}.md`);

            fs.writeFileSync(filePath, mdContent, 'utf8');

            execFileSync('git', ['config', 'user.email', 'actions@github.com']);
            execFileSync('git', ['config', 'user.name', 'GitHub Actions']);
            execFileSync('git', ['add', filePath]);
            execFileSync('git', ['commit', '-m', `Add claimed author page for @${claim.github} (closes #${issue.number})`]);
            execFileSync('git', ['push']);

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `✅ Author page for @${claim.github} has been added! It will be live at https://www.tinytooltown.com/authors/${claim.github}/ once the site rebuilds.\n\nThanks for being part of Tiny Tool Town! 🏘️`,
            });

            for (const label of ['queued-author', 'needs-maintainer-review']) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: label,
              }).catch(error => {
                if (error.status !== 404) throw error;
              });
            }

            const refreshedIssue = await github.rest.issues.get({
              owner, repo, issue_number: issue.number,
            });
            if (refreshedIssue.data.state !== 'closed') {
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
